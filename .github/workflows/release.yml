name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev

jobs:
    release:
        name: Release
        permissions:
            contents: write
            packages: write
            id-token: write
            attestations: write
            artifact-metadata: write
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Cache Gradle
              uses: burrunan/gradle-cache-action@v3

            - name: Setup keystore
              env:
                  KEYSTORE_B64: ${{ secrets.KEYSTORE }}
              run: |
                  set -euo pipefail
                  test -n "$KEYSTORE_B64" || { echo "::error::Missing KEYSTORE secret"; exit 1; }
                  printf '%s' "$KEYSTORE_B64" | base64 --decode > "app/keystore.jks"
                  test -s "app/keystore.jks"

            - name: Build signed release APK
              env:
                  ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
                  ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
                  KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
              run: |
                  set -euo pipefail
                  test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD"; exit 1; }
                  test -n "$KEYSTORE_ENTRY_ALIAS" || { echo "::error::Missing KEYSTORE_ENTRY_ALIAS"; exit 1; }
                  test -n "$KEYSTORE_ENTRY_PASSWORD" || { echo "::error::Missing KEYSTORE_ENTRY_PASSWORD"; exit 1; }
                  ./gradlew --no-daemon assembleRelease

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Import GPG key
              uses: crazy-max/ghaction-import-gpg@v7
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.GPG_PASSPHRASE }}
                  fingerprint: ${{ vars.GPG_FINGERPRINT }}

            - name: Release API
              run: npx multi-semantic-release --tag-format 'api@${version}' --ignore-packages app
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
                  ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

            - name: Release
              id: release
              run: |
                  npx multi-semantic-release --tag-format 'v${version}' --ignore-packages api
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
                  ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
                  KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}

            - name: Attest
              if: steps.release.outputs.NEW_TAG != ''
              uses: actions/attest@v4
              with:
                  subject-name: "ZUNOX ${{ steps.release.outputs.NEW_TAG }}"
                  subject-path: app/build/outputs/apk/release/ZUNOX*.apk
