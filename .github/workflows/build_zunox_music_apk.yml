name: Build ZUNOX Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - zunox-cairo-splash-9530
    paths:
      - "music-patcher-cli/**"
      - "cairo-patch-bundle/src/main/kotlin/**"
      - ".github/workflows/build_zunox_music_apk.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "music-patcher-cli/**"
      - "cairo-patch-bundle/src/main/kotlin/**"
      - ".github/workflows/build_zunox_music_apk.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: zunox-music-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Patch and sign YouTube Music 9.47.51 as ZUNOX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUNOX
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download clean YouTube Music 9.47.51 ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output youtube-music-9.47.51-arm64.apk \
            "https://d.apkpure.net/b/APK/com.google.android.apps.youtube.music?nc=arm64-v8a&sv=32&versionCode=94751240"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging youtube-music-9.47.51-arm64.apk | head -n 1 | tee apk-metadata.txt
          grep -Fq "package: name='com.google.android.apps.youtube.music'" apk-metadata.txt
          grep -Fq "versionCode='94751240'" apk-metadata.txt
          grep -Fq "versionName='9.47.51'" apk-metadata.txt
          sha256sum youtube-music-9.47.51-arm64.apk

      - name: Build JVM patch bundle and runner
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -p music-patcher-cli jar --no-daemon

      - name: Apply ZUNOX patches to clean APK
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -p music-patcher-cli run --no-daemon --args="$GITHUB_WORKSPACE/youtube-music-9.47.51-arm64.apk $GITHUB_WORKSPACE/music-patcher-cli/build/libs/zunox-music-patches-0.1.0.jar $GITHUB_WORKSPACE/zunox-music-unsigned.apk $ANDROID_HOME"

      - name: Configure release signing
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::KEYSTORE_BASE64 is missing."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > zunox-release.jks
          test -s zunox-release.jks

      - name: Verify release signing secrets
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}"
          test -n "${KEYSTORE_ENTRY_ALIAS:-}"
          test -n "${KEYSTORE_ENTRY_PASSWORD:-}"

      - name: Align and sign ZUNOX Music APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -p -f 4 zunox-music-unsigned.apk zunox-music-aligned.apk
          "$tools/apksigner" sign \
            --ks zunox-release.jks \
            --ks-key-alias "$KEYSTORE_ENTRY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_ENTRY_PASSWORD \
            --out ZUNOX-Music-9.47.51-arm64.apk \
            zunox-music-aligned.apk
          "$tools/apksigner" verify --verbose ZUNOX-Music-9.47.51-arm64.apk
          "$tools/aapt" dump badging ZUNOX-Music-9.47.51-arm64.apk | head -n 4

      - name: Upload signed ZUNOX Music APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: zunox-music-9.47.51-release
          path: ZUNOX-Music-9.47.51-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned debug preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: zunox-music-9.47.51-debug-preview
          path: zunox-music-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: rm -f zunox-release.jks
