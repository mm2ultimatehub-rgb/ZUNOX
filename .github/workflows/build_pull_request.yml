name: ZUNOX Android APK

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: APK signing mode
        required: true
        type: choice
        options:
          - debug-preview
          - release
        default: debug-preview
  push:
    branches:
      - zunox-cairo-splash-9530
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: zunox-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          test -s app/keystore.jks

      - name: Verify release signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'release' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "::error::KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "${KEYSTORE_ENTRY_ALIAS:-}" || { echo "::error::KEYSTORE_ENTRY_ALIAS is missing."; exit 1; }
          test -n "${KEYSTORE_ENTRY_PASSWORD:-}" || { echo "::error::KEYSTORE_ENTRY_PASSWORD is missing."; exit 1; }

      - name: Build debug-signed preview
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.signing_mode == 'debug-preview' }}
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon -PsignAsDebug

      - name: Build production-signed release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'release' }}
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK output
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::Gradle completed without producing an APK."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            sha256sum "$apk"
            if [ "${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'release' }}" = "true" ]; then
              apksigner verify --verbose "$apk"
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zunox-${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'release' && 'release' || 'debug-preview' }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f app/keystore.jks
