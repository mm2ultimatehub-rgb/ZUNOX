name: Build ZUNOX Cairo Patch Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - zunox-cairo-splash-9530
    paths:
      - "cairo-patch-bundle/**"
      - ".github/workflows/build_cairo_patch_bundle.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "cairo-patch-bundle/**"
      - ".github/workflows/build_cairo_patch_bundle.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: zunox-cairo-patch-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile patch bundle DEX/JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUNOX
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Cairo patch bundle
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -p cairo-patch-bundle packagePatchBundle --no-daemon

      - name: Verify bundle structure
        shell: bash
        run: |
          set -euo pipefail
          bundle="cairo-patch-bundle/build/outputs/patch-bundle/zunox-cairo-patches-0.1.0.jar"
          test -s "$bundle"
          unzip -l "$bundle"
          unzip -l "$bundle" | grep -q 'classes.dex'
          unzip -p "$bundle" META-INF/MANIFEST.MF | grep -q 'ZUNOX Cairo Splash Patch'

          # Android may split compiled code across classes.dex, classes2.dex, etc.
          # Search every DEX instead of assuming the patch class lands in classes.dex.
          mapfile -t dex_entries < <(unzip -Z1 "$bundle" | grep -E '^classes([0-9]+)?\.dex$')
          if [ "${#dex_entries[@]}" -eq 0 ]; then
            echo "::error::Patch bundle contains no DEX files."
            exit 1
          fi

          found_marker=false
          for dex in "${dex_entries[@]}"; do
            if unzip -p "$bundle" "$dex" | strings -a | grep -Fq 'Could not uniquely locate MusicActivity.onCreate'; then
              echo "Verified Cairo patch marker in $dex"
              found_marker=true
              break
            fi
          done
          if [ "$found_marker" != "true" ]; then
            echo "::error::Cairo patch marker was not found in any DEX file."
            exit 1
          fi

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: zunox-cairo-patches-0.1.0
          path: cairo-patch-bundle/build/outputs/patch-bundle/zunox-cairo-patches-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
