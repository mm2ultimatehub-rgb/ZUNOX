name: Inspect YouTube Music 9.47.51 Cairo reference

on:
  workflow_dispatch:
  push:
    branches:
      - zunox-cairo-splash-9530
    paths:
      - ".github/workflows/inspect_cairo_reference.yml"
      - "scripts/inspect_cairo_reference.sh"
      - "scripts/validate_cairo_patch_shape.py"

permissions:
  contents: read

jobs:
  inspect-reference:
    name: Download and inspect clean YouTube Music 9.47.51 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUNOX
        uses: actions/checkout@v4

      - name: Install APK inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apktool

      - name: Inspect clean YouTube Music 9.47.51 APK
        run: |
          chmod +x scripts/inspect_cairo_reference.sh
          scripts/inspect_cairo_reference.sh

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairo-reference-inspection
          path: |
            cairo-reference-report/REPORT.txt
            cairo-reference-report/FINGERPRINT_EVIDENCE.txt
            cairo-reference-report/METHOD_DUMP.txt
            cairo-reference-report/PATCH_SHAPE_VALIDATION.txt
          if-no-files-found: warn
          retention-days: 14
